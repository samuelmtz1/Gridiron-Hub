name: Scheduled Post-Game Ingestion Pipeline

on:
  schedule:
    # Corre los lunes a las 05:00 UTC (Domingos 23:00 CST tras el Sunday Night Football de NFL)
    - cron: '0 5 * * 1'
    # Corre los domingos a las 06:00 UTC (Sábados 00:00 CST tras los partidos nocturnos de NCAA)
    - cron: '0 6 * * 0'
  # Permite disparar la ingesta manualmente desde la pestaña Actions en GitHub
  workflow_dispatch:
    inputs:
      league:
        description: 'Liga a procesar (nfl o ncaa)'
        required: true
        default: 'nfl'
        type: choice
        options:
          - nfl
          - ncaa
      season:
        description: 'Año de la temporada'
        required: true
        default: '2024'
      week:
        description: 'Número de semana'
        required: true
        default: '11'

jobs:
  ingest:
    name: Run Post-Game Ingestion & Analytics
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Ingestion Pipeline
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          NFLREADPY_CACHE: filesystem
        run: |
          python -m ingestion.pipeline --league ${{ inputs.league || 'nfl' }} --season ${{ inputs.season || 2024 }} --week ${{ inputs.week || 11 }}

      - name: Verify analytics integrity
        run: |
          pytest tests/test_storage.py tests/test_processing.py
