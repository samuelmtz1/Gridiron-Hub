services:
  - type: web
    name: gridiron-hub-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn api.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: APP_ENV
        value: production
      - key: AUTH_REQUIRED
        value: "true"
      - key: TEAM_USERNAME
        value: gridiron_team
      - key: TEAM_PASSWORD
        sync: false
      - key: TEAM_SHARED_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
